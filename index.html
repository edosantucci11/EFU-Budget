}
function statsYear(y) {
  const months = Array.from({ length: 12 }, (_, i) => y + '-' + pad(i + 1));
  const st = months.map(monthStats);
  const inc = sum(st.map(s => s.inc)), out = sum(st.map(s => s.out)), saved = sum(st.map(s => s.saved));
  let h = kpiGrid([['Entrate', eur(inc), 'pos'], ['Uscite', eur(out), 'neg'], ['Risultato', eur(inc - out, { sign: true })], ['Nei salvadanai', eur(saved)]]);
  h += section('Entrate e uscite per mese', yearBars(months, st) + `<div class="lg-inline"><span><i class="k-in"></i>Entrate</span><span><i class="k-out"></i>Uscite</span></div>`, null, 'Tocca un mese per vederne il dettaglio.');
  const ck = curMk(), t = today();
  const rows = months.map((k, i) => {
    const s = st[i], future = k > ck;
    return `<tr class="${k === ck ? 'cur' : ''}" data-a="goMonth" data-k="${k}"><td>${cap(MESI_S[i])}</td><td class="num pos">${future && !s.n ? '' : eur0(s.inc)}</td><td class="num neg">${future && !s.n ? '' : eur0(s.out)}</td><td class="num">${future && !s.n ? '' : eur0(s.net)}</td><td class="num">${future ? '' : eur0(availAt(k === ck ? t : endOf(k)))}</td></tr>`;
  }).join('');
  h += section('Riepilogo mese per mese', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mese</th><th>Entrate</th><th>Uscite</th><th>Netto</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Totale</td><td class="num pos">${eur0(inc)}</td><td class="num neg">${eur0(out)}</td><td class="num">${eur0(inc - out)}</td><td></td></tr></tfoot></table></div>`, null, 'Saldo: disponibile a fine mese, senza i salvadanai.');
  const catTot = {};
  st.forEach(s => { for (const id in s.byCat) catTot[id] = (catTot[id] || 0) + s.byCat[id]; });
  const parts = Object.entries(catTot).map(([id, v]) => ({ c: cat(id), v: r2(v) })).filter(p => p.c && p.c.type === 'out' && p.v > 0).sort((a, b) => b.v - a.v);
  if (parts.length) {
    const tt = sum(parts.map(p => p.v));
    h += section("Spese per categoria nell'anno", `<div class="legend">${parts.map(p => `<div class="lrow static"><i style="background:${p.c.color}"></i><span class="nm">${esc(p.c.emoji)} ${esc(p.c.name)}</span><span class="num">${eur(p.v)}</span><span class="muted num">${pct(p.v / tt)}</span></div>`).join('')}</div>`);
  }
  return h;
}

/* ---------- grafici ---------- */
function donut(parts, total, top, bottom) {
  const R = 64, C = 2 * Math.PI * R, SW = 22;
  let off = 0, segs = '';
  const gap = parts.length > 1 ? 1.5 : 0;
  for (const p of parts) {
    const len = total > 0 ? p.v / total * C : 0, L = Math.max(0.5, len - gap);
    segs += `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${p.color}" stroke-width="${SW}" stroke-dasharray="${L.toFixed(2)} ${(C - L).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"/>`;
    off += len;
  }
  return `<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="Spese per categoria"><circle r="${R}" cx="90" cy="90" fill="none" class="d-bg" stroke-width="${SW}"/>${segs}<text x="90" y="88" text-anchor="middle" class="d-v">${esc(top)}</text><text x="90" y="108" text-anchor="middle" class="d-l">${esc(bottom)}</text></svg>`;
}
function balanceChart(k) {
  const ck = curMk(), t = today(), n = dim(k);
  if (k > ck) return '<p class="muted">Il mese non è ancora iniziato.</p>';
  const last = k === ck ? Number(t.slice(8)) : n;
  const act = [];
  for (let d = 1; d <= last; d++) act.push(availAt(k + '-' + pad(d)));
  const proj = [];
  if (k === ck) {
    const pend = pendingFixed(ck).map(p => ({ due: p.due < t ? t : p.due, d: pendDelta(p) }));
    for (let d = last; d <= n; d++) {
      const ds = k + '-' + pad(d);
      let v = availAt(ds);
      for (const p of pend) if (p.due <= ds) v += p.d;
      proj.push(r2(v));
    }
  }
  const all = act.concat(proj);
  let min = Math.min(...all), max = Math.max(...all);
  if (max - min < 1) { min -= 50; max += 50; }
  const pv = (max - min) * 0.14; min -= pv; max += pv;
  const W = 340, H = 172, L = 4, R = 4, T = 10, B = 24;
  const X = d => L + (W - L - R) * (d - 1) / Math.max(1, n - 1);
  const Y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const path = (arr, d0) => arr.map((v, i) => (i ? 'L' : 'M') + X(d0 + i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const pa = path(act, 1);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del disponibile nel mese"><defs><linearGradient id="gArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.2"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
  for (let i = 0; i <= 2; i++) { const yy = T + (H - T - B) * i / 2; s += `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" class="grid"/>`; }
  if (min < 0 && max > 0) s += `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" class="zero"/>`;
  s += `<path d="${pa} L${X(last).toFixed(1)} ${H - B} L${X(1).toFixed(1)} ${H - B} Z" fill="url(#gArea)"/><path d="${pa}" class="ln"/>`;
  if (proj.length > 1) s += `<path d="${path(proj, last)}" class="ln dash"/>`;
  s += `<circle cx="${X(last).toFixed(1)}" cy="${Y(act[act.length - 1]).toFixed(1)}" r="4.5" class="dot"/>`;
  for (const d of [1, 10, 20, n]) s += `<text x="${X(d).toFixed(1)}" y="${H - 6}" text-anchor="${d === 1 ? 'start' : d === n ? 'end' : 'middle'}" class="ax">${d} ${MESI_S[Number(k.slice(5)) - 1]}</text>`;
  s += '</svg>';
  const endV = k === ck ? proj[proj.length - 1] : act[act.length - 1];
  return s + `<div class="chart-foot"><span>Primo del mese<b class="num">${eur(act[0])}</b></span><span>${k === ck ? 'Previsto a fine mese' : 'Fine mese'}<b class="num ${endV < 0 ? 'neg' : ''}">${eur(endV)}</b></span></div>`;
}
function yearBars(months, st) {
  const max = Math.max(1, ...st.map(s => Math.max(s.inc, s.out)));
  const W = 340, H = 170, T = 8, B = 22, gw = W / 12, bw = Math.min(10, gw / 2 - 3), base = H - B;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entrate e uscite per mese">`;
  for (let i = 0; i <= 2; i++) { const yy = T + (base - T) * i / 2; s += `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" class="grid"/>`; }
  months.forEach((k, i) => {
    const x = i * gw + gw / 2, hi = (base - T) * st[i].inc / max, ho = (base - T) * st[i].out / max;
    s += `<g class="bgrp${k === UI.month ? ' on' : ''}" data-a="goMonth" data-k="${k}"><rect x="${(x - gw / 2).toFixed(1)}" y="0" width="${gw.toFixed(1)}" height="${H}" class="hit"/>`;
    if (st[i].inc > 0) s += `<rect x="${(x - bw - 1).toFixed(1)}" y="${(base - hi).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2, hi).toFixed(1)}" rx="2.5" class="b-in"/>`;
    if (st[i].out > 0) s += `<rect x="${(x + 1).toFixed(1)}" y="${(base - ho).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2, ho).toFixed(1)}" rx="2.5" class="b-out"/>`;
    s += `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle" class="ax">${MESI_S[i].charAt(0).toUpperCase()}</text></g>`;
  });
  return s + '</svg>';
}

SHEETS.recap = {
  cls: 'tall',
  render(st, sh) {
    const k = sh.props.k, ms = monthStats(k), pk = addM(k, -1), pm = monthStats(pk), ck = curMk();
    const mName = MESI[Number(k.slice(5)) - 1];
    const outs = spendParts(ms), tot = sum(outs.map(p => p.v)), movs = monthMovs(k);
    const big = movs.filter(m => m.type === 'out').sort((a, b) => eff(b) - eff(a))[0];
    const lastDay = k === ck ? Number(today().slice(8)) : k < ck ? dim(k) : 0;
    const spentDays = new Set(movs.filter(m => m.type === 'out').map(m => Number(m.date.slice(8))).filter(d => d <= lastDay));
    const bc = activeCats('out').filter(c => c.budget > 0), okB = bc.filter(c => (ms.byCat[c.id] || 0) <= c.budget).length;
    const diff = pm.out > 0 ? (ms.out - pm.out) / pm.out : null;
    let h = sheetHead(cap(mName) + ' in breve') + '<div class="sheet-body recap-b">';
    h += `<div class="rc hero-rc"><span>Risultato del mese</span><b class="num">${eur(ms.net, { sign: true })}</b><p>${ms.rate == null ? 'Nessuna entrata registrata nel mese.' : ms.rate >= 0 ? `Hai tenuto il ${pct(ms.rate)} di quello che è entrato.` : 'Hai speso più di quanto è entrato.'}</p></div>`;
    h += `<div class="rc-row"><div class="rc"><span>Entrate</span><b class="num pos">${eur(ms.inc)}</b></div><div class="rc"><span>Uscite</span><b class="num neg">${eur(ms.out)}</b></div></div>`;
    if (outs.length) h += `<div class="rc"><span>Dove sono andati i soldi</span><div class="rc-top">${avatar(outs[0].c.emoji, outs[0].c.color, 'lg')}<div><b>${esc(outs[0].c.name)}</b><p class="muted">${eur(outs[0].v)}, il ${pct(outs[0].v / tot)} delle uscite</p></div></div>${outs.slice(1, 3).map(p => `<p class="rc-l"><i style="background:${p.c.color}"></i>${esc(p.c.name)}<span class="num">${eur(p.v)}</span></p>`).join('')}</div>`;
    if (big) h += `<div class="rc"><span>La spesa più grande</span><b>${esc(big.description || (cat(big.categoryId) || {}).name || 'Spesa')}</b><p class="muted"><span class="num">${eur(eff(big))}</span>, ${esc(dayTitle(big.date).toLowerCase())}</p></div>`;
    const cards = [];
    if (lastDay) cards.push(['Giorni senza spese', `${lastDay - spentDays.size} su ${lastDay}`]);
    if (bc.length) cards.push(['Budget rispettati', `${okB} su ${bc.length}`]);
    if (diff != null) cards.push([`Uscite rispetto a ${MESI[Number(pk.slice(5)) - 1]}`, `${diff > 0.0005 ? '+' : diff < -0.0005 ? '−' : ''}${pct(Math.abs(diff))}`]);
    if (ms.saved) cards.push(['Nei salvadanai', eur(ms.saved)]);
    cards.push(['Movimenti registrati', String(ms.n)]);
    h += `<div class="rc-grid">${cards.map(([l, v]) => `<div class="rc"><span>${l}</span><b class="num">${v}</b></div>`).join('')}</div>`;
    return h + '</div>';
  }
};

SHEETS.pin = {
  init: p => ({ mode: p.mode, step: p.mode === 'set' ? 'new' : 'old', a: '', b: '', err: '' }),
  render(st) {
    const title = { set: 'Imposta il codice', change: 'Cambia codice', off: 'Disattiva codice' }[st.mode];
    const prompt = st.step === 'old' ? 'Inserisci il codice attuale' : st.step === 'new' ? 'Scegli un codice di 4 cifre' : 'Ripeti il codice per conferma';
    const cur = st.step === 'confirm' ? st.b : st.a;
    return sheetHead(title) + `<div class="sheet-body center pin-b"><p class="lead">${prompt}</p>${pinDots(cur.length, st.err ? 'shake' : '')}<p class="lock-err">${esc(st.err)}</p>${pinPad('pinKey')}</div>`;
  }
};
ACT.pinOpen = el => openSheet('pin', { mode: el.dataset.m });
ACT.pinKey = async el => {
  const sh = sheetOf(el), st = sh.st, k = el.dataset.k, f = st.step === 'confirm' ? 'b' : 'a';
  if (k === 'del') st[f] = st[f].slice(0, -1); else if (st[f].length < 4) st[f] += k;
  st.err = '';
  drawSheet(sh);
  if (st[f].length < 4) return;
  if (st.step === 'old') {
    const ok = (await hashPin(st.a, D.settings.pin.salt)) === D.settings.pin.hash;
    if (!ok) { st.a = ''; st.err = 'Codice errato'; return drawSheet(sh); }
    if (st.mode === 'off') { D.settings.pin = null; save(); closeSheet(sh); refresh(); return toast('Codice disattivato'); }
    st.step = 'new'; st.a = '';
    return drawSheet(sh);
  }
  if (st.step === 'new') { st.step = 'confirm'; return drawSheet(sh); }
  if (st.a !== st.b) { st.step = 'new'; st.a = ''; st.b = ''; st.err = 'I due codici non coincidono, riprova'; return drawSheet(sh); }
  const salt = uid();
  D.settings.pin = { salt, hash: await hashPin(st.a, salt) };
  save(); closeSheet(sh); refresh();
  toast(st.mode === 'change' ? 'Codice cambiato' : 'Codice attivato');
};

function cellDate(c) {

async function fxRate(from, to, date) {

  const day = !date || date >= today() ? 'latest' : date;
  const key = day + '|' + from + '|' + to, c = fxCache(), hit = c[key];
  if (hit && (day !== 'latest' || Date.now() - hit.t < 6 * 3600e3)) return hit;

    const j = await getJSON(`https://api.frankfurter.dev/v1/${day}?base=${from}&symbols=${to}`);
    if (j && j.rates && j.rates[to] > 0) res = { rate: j.rates[to], date: j.date || date || today(), src: 'BCE' };
  } catch (e) { }
  if (!res) {
    const f = from.toLowerCase(), t = to.toLowerCase();
    for (const u of [`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${day}/v1/currencies/${f}.json`, `https://${day}.currency-api.pages.dev/v1/currencies/${f}.json`]) {
      try { const j = await getJSON(u); if (j && j[f] && j[f][t] > 0) { res = { rate: j[f][t], date: j.date || date || today(), src: 'mercato' }; break; } } catch (e) { }
    }
  }
  if (!res) return hit || null;
  res.rate = Math.round(res.rate * 1e6) / 1e6;

function demoInvest() {
  const start = addDays(today(), -7 * 26);
  const mkP = (name, code, kind, inv0, drift, vol, seed) => {
    let s = seed;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const p = { id: uid(), name, code, kind, qty: null, created: start, hist: [] };
    let v = inv0, inv = inv0;
    for (let w = 0; w <= 26; w++) {
      if (w && w % 4 === 0) { inv += 200; v += 200; }
      if (w) v *= 1 + drift + (r() - 0.5) * vol;
      p.hist.push({ d: addDays(start, w * 7), v: r2(v), i: inv });
    }
    p.invested = inv;
    return p;
  };
  return [mkP('Vanguard FTSE All-World', 'VWCE', 'etf', 6000, 0.0025, 0.035, 12345), mkP('iShares Core MSCI EM IMI', 'EIMI', 'etf', 1500, 0.0012, 0.05, 777)];
}

const PX_DEFAULT = 'https://efu-prezzi.edo-santucci.workers.dev';
const pxUrl = () => { if (!D) return ''; const u = D.settings.pxUrl; return u === undefined || u === null ? PX_DEFAULT : u; };
function pxEndpoint(path, params) {
  const u = new URL(pxUrl().replace(/\/+$/, '') + path);
  for (const k in params) u.searchParams.set(k, params[k]);
  if (D.settings.pxKey) u.searchParams.set('key', D.settings.pxKey);
  return u.toString();
}
const pxAuto = p => !!(pxUrl() && p.sym && p.qty > 0);
let PX_BUSY = false;
async function autoPrices(force) {
  if (!D || !pxUrl() || PX_BUSY) return null;
  const list = D.invest.filter(pxAuto);
  if (!list.length) return { n: 0, errs: [] };
  if (!force && Date.now() - (D.settings.pxLast || 0) < 3 * 3600e3) return null;
  PX_BUSY = true;
  try {
    const syms = Array.from(new Set(list.map(p => p.sym)));
    const j = await getJSON(pxEndpoint('', { s: syms.join(',') }), 12000);
    if (!j || !j.quotes) throw new Error((j && j.error) || 'risposta non valida');
    let n = 0;
    const errs = [], t = today();
    for (const p of list) {
      const q = j.quotes[p.sym];
      if (!q || !(q.price > 0)) { errs.push(p.sym); continue; }
      let price = q.price, cur = String(q.currency || baseCur());
      if (cur === 'GBp' || cur === 'GBX') { price /= 100; cur = 'GBP'; }
      cur = cur.toUpperCase();
      let rate = 1;
      if (cur !== baseCur()) { const r = await fxRate(cur, baseCur(), t); if (!r) { errs.push(p.sym); continue; } rate = r.rate; }
      const unit = price * rate;
      p.px = { price: q.price, cur: q.currency || cur, unit: Math.round(unit * 1e6) / 1e6, at: q.time || new Date().toISOString() };
      invPoint(p, t, p.qty * unit, p.invested || 0);
      n++;
    }
    D.settings.pxLast = Date.now();
    D.settings.pxErr = errs.length ? 'Nessun prezzo per ' + errs.join(', ') + ': controlla il simbolo.' : '';
    save({ undo: false });
    return { n, errs };
  } catch (e) {
    D.settings.pxErr = 'Il ponte non risponde: ' + ((e && e.message) || e);
    save({ undo: false });
    return null;
  } finally {
    PX_BUSY = false;
    redrawInvest();
    const ae = document.activeElement;
    if (!ae || !/INPUT|TEXTAREA|SELECT/.test(ae.tagName)) refresh();
  }
}

/* ---------- piani di accumulo (PAC) ---------- */
function investAccount() {
  let a = D.accounts.find(x => x.kind === 'invest' && !x.archived);
  if (!a) { a = { id: 'inv-acc', name: 'Investimenti', emoji: '📈', kind: 'invest', initial: 0, initialDate: today(), archived: false }; D.accounts.push(a); }
  return a;
}
/* acquisto (amt > 0) o annullamento (amt < 0) alla data d: aggiorna capitale, valore, storico e quote */
function invBuy(p, d, amt, dq) {
  const hist = p.hist || (p.hist = []);
  let prev = null;
  for (const h of hist) { if (h.d <= d) prev = h; else break; }
  for (const h of hist) if (h.d > d) { h.v = r2(Math.max(0, h.v + amt)); h.i = r2(Math.max(0, h.i + amt)); }
  if (prev && prev.d === d) { prev.v = r2(Math.max(0, prev.v + amt)); prev.i = r2(Math.max(0, prev.i + amt)); }
  else { hist.push({ d, v: r2(Math.max(0, (prev ? prev.v : 0) + amt)), i: r2(Math.max(0, (prev ? prev.i : 0) + amt)) }); hist.sort((a, b) => a.d.localeCompare(b.d)); }
  p.invested = r2(Math.max(0, (p.invested || 0) + amt));
  if (dq == null) dq = p.qty > 0 && p.px && p.px.unit > 0 ? Math.round(amt / p.px.unit * 1e6) / 1e6 : 0;
  if (dq && p.qty > 0) p.qty = Math.max(0, Math.round((p.qty + dq) * 1e6) / 1e6);
  return { invId: p.id, amt, qty: dq };
}
function syncPAC() {
  if (!D || !D.fixed) return false;
  let ch = false;
  const t = today();
  for (const f of D.fixed) {
    if (!f.pac || f.paused) continue;
    const log = f.pac.log || (f.pac.log = {});
    for (const o of occurrences(f, trackStart(f), curMk())) {
      if (o.due > t || (f.pac.from && o.due < f.pac.from) || log[o.k] || (f.skipped || []).includes(o.k)) continue;
      const id = 'pac-' + f.id + '-' + o.k;
      if (!D.movements.some(m => m.id === id)) D.movements.push({ id, ts: dateOf(o.due).getTime(), type: 'transfer', date: o.due, amount: f.amount, accountId: f.accountId, toAccountId: investAccount().id, description: f.name, note: '', tags: [], fixedId: f.id, fixedKey: o.k, pacOf: f.id });
      log[o.k] = (f.pac.alloc || []).filter(a => a.amt > 0 && invById(a.invId)).map(a => invBuy(invById(a.invId), o.due, a.amt));
      ch = true;
    }
  }
  return ch;
}
function pacUndo(m) {
  const f = D.fixed.find(x => x.id === m.pacOf);

  confirmBox('Sostituire i dati?', `Il file${when ? ' del ' + esc(when) : ''} contiene ${data.movements.length} movimenti, con conti, categorie, spese fisse, investimenti e impostazioni. I dati attuali su questo telefono verranno sostituiti.`, 'Importa tutto', go);
  return true;
}
CHG.restoreFile = async el => {
  const f = el.files && el.files[0];
  if (!f) return;
  let obj = null;
  try {
    if (/\.(xlsx|xls|xlsm)$/i.test(f.name)) { const XLSX = await loadXLSX(); obj = readFullData(XLSX, XLSX.read(await f.arrayBuffer(), { type: 'array' })); }
    else obj = JSON.parse(await f.text());
  } catch (e) { obj = null; }
  el.value = '';
  if (obj && obj.type === 'budget-sync') return toast('Questo è un file del budget di coppia: aprilo da Budget di coppia → Ricevi.', null);
  if (!obj) return toast('Il file scelto non è un backup o un\'esportazione di EFU Budget.', null);
  await restoreBackupObj(obj);
};

/* ---------- guida e soluzioni ---------- */
const GUIDE = [

  ['Budget per categoria e avvisi', `<p>In <b>Pianifica → Budget</b> dai a ogni categoria un tetto mensile. Nella Home vedi quanto hai speso e quanto resta.</p><p>Quando ti avvicini al budget o lo superi compare un avviso nell'app. Nella Home trovi anche il riepilogo del mese, con entrate, uscite e qualche curiosità.</p><p>Le categorie si creano e si modificano in Impostazioni → Categorie.</p>`],
  ['Conti e trasferimenti', `<p>In Impostazioni → Conti aggiungi conto corrente, carte, contanti o altro, con il saldo a una certa data. Il <b>conto predefinito</b> è quello proposto per le nuove spese.</p><p>Per spostare soldi tra due conti usa <b>Trasferimento</b>: non conta né come spesa né come entrata.</p><p>Il saldo iniziale è quello all'inizio del giorno indicato: se un saldo non torna, controlla quella data.</p>`, ['Apri i conti', 'data-a="setPage" data-p="accounts"']],
  ['Carta di credito', `<p>Apri la carta in Impostazioni → Conti e attiva <b>Carta di credito con addebito mensile</b>: indica il giorno di chiusura, il giorno di addebito e il conto da cui vengono presi i soldi.</p><p>Le spese fino al giorno di chiusura vanno nell'estratto del mese, quelle dopo nel ciclo successivo. Il giorno dell'addebito l'app registra da sola il trasferimento dal conto alla carta. Nella Home vedi quanto hai speso nel ciclo e il prossimo addebito.</p><p>Se la banca addebita una cifra diversa, correggi il movimento dell'addebito: non verrà più ricalcolato. Se importi l'estratto conto, elimina le righe «addebito carta», altrimenti la spesa risulta due volte.</p>`],

  ['Salvadanai e obiettivi', `<p>I salvadanai sono soldi messi da parte per un obiettivo, con una cifra e una data se vuoi. Li trovi in <b>Pianifica → Salvadanai</b> e nella Home.</p><p>Per versare o prelevare apri il salvadanaio. Per un versamento automatico ogni mese crea una spesa fissa di tipo <b>Risparmio</b>.</p><p>I soldi nei salvadanai non contano nel <b>Disponibile</b>.</p>`],
  ['Investimenti', `<p>In Home → <b>Investimenti</b> aggiungi ETF, azioni, fondi o altro: quanto hai investito, quanto vale oggi e, se vuoi, le quote. Vedi valore, guadagno o perdita e il grafico rispetto al capitale investito.</p><p>Una volta a settimana, all'apertura, l'app ti chiede i nuovi valori; con le quote basta il prezzo di una quota. La frequenza si cambia, anche su <b>Mai</b>. Con <b>Compra o vendi</b> registri acquisti e vendite senza falsare il guadagno.</p>`, ['Apri gli investimenti', 'data-a="invOpen"']],
  ['Prezzi automatici', `<p>Il ponte dei prezzi è già collegato. Perché un investimento si aggiorni da solo servono il <b>simbolo</b> e le <b>quote</b>: aprilo, tocca <b>Modifica</b> e usa «Trova il simbolo dal nome o dall'ISIN».</p><p>I simboli di solito finiscono con <b>.MI</b> per Milano, <b>.DE</b> per Xetra e <b>.L</b> per Londra. I prezzi si aggiornano quando apri l'app, al massimo ogni 3 ore, oppure con <b>Aggiorna ora</b>, e hanno circa 15 minuti di ritardo.</p><p>Se compare «Nessun prezzo per…», il simbolo è sbagliato: cercalo di nuovo.</p>`],
  ['PAC, piani di accumulo', `<p>In Investimenti → <b>Nuovo PAC</b> scegli il conto, ogni quanto, la data del primo acquisto e quanto mettere in ogni titolo.</p><p>Alla data giusta l'app sposta i soldi dal conto agli investimenti e aggiorna capitale, valore e quote: non devi registrare niente. Gli acquisti in arrivo entrano nella previsione di fine mese.</p><p>Per cambiare l'importo modifica il PAC: vale dal prossimo acquisto. Se cancelli un acquisto dai movimenti, viene tolto anche dall'investimento.</p>`],
  ['Spese divise e persone', `<p>Nei dettagli di una spesa puoi dividerla con altre persone, oppure indicare che l'ha pagata qualcun altro: l'app tiene il conto di chi deve cosa.</p><p>In Impostazioni → Persone vedi i saldi; quando qualcuno ti restituisce i soldi registra un <b>rimborso</b>.</p>`, ['Apri le persone', 'data-a="setPage" data-p="people"']],
  ['Budget di coppia', `<p>In Impostazioni → <b>Budget di coppia</b> scrivi il tuo nome. Ognuno registra le spese sul proprio telefono; ogni tanto toccate <b>Invia</b> e mandate il file all'altra persona, che lo apre con <b>Ricevi</b>.</p><p>L'app unisce i movimenti senza doppioni, fa arrivare anche le cancellazioni e mostra chi ha inserito cosa. Se modificate entrambi la stessa voce vale la modifica più recente. Foto, codice di blocco e impostazioni restano personali.</p>`, ['Apri Budget di coppia', 'data-a="setPage" data-p="share"']],
  ['Pagamenti con Apple Pay', `<p>Un'automazione di Comandi Rapidi scrive ogni pagamento contactless in un file su iCloud Drive; nell'app lo importi e i pagamenti compaiono nella Home in <b>Pagamenti da controllare</b>, con la categoria suggerita.</p><p>Le istruzioni passo passo sono nella pagina dedicata. Funziona con i pagamenti nei negozi, non con quelli online.</p>`, ['Apri le istruzioni', 'data-a="setPage" data-p="applepay"']],
  ['Importare dati', `<p>In Impostazioni → <b>Importa dati</b> puoi scegliere:</p><ul><li>un file <b>esportato da EFU Budget</b> o un <b>backup</b>: reimporta tutto, anche su un altro telefono;</li><li>il file <b>Excel del tuo budget</b>;</li><li>l'esportazione di <b>un'altra app</b>, come Money Lover, Wallet o Spendee, oppure l'<b>estratto conto</b> della banca, in CSV o Excel.</li></ul><p>Negli ultimi due casi l'app riconosce le colonne e ti fa controllare tutto prima di importare; i movimenti già presenti non vengono duplicati.</p>`, ['Importa dati', 'data-a="openImportAny"']],
  ['Esportare e fare il backup', `<p><b>Esporta in Excel</b> crea un file con tutti i dati: movimenti, conti, categorie, spese fisse, salvadanai, investimenti, PAC, impostazioni e foto. Puoi leggerlo con Excel e reimportarlo in EFU Budget su qualsiasi telefono. Il periodo che scegli vale solo per i fogli da leggere: i dati per reimportare sono sempre completi.</p><p>Il <b>CSV</b> contiene solo i movimenti del periodo, per usarli in altre app. Il <b>Backup completo</b> è un file .json con tutto, alternativo all'Excel.</p><p>Prima di cancellare tutti i dati, o di sostituirli importando un file, l'app ti propone di esportarli: basta salvare il file e poi confermare.</p><p>Esporta almeno una volta al mese e salva il file in File o su iCloud Drive.</p>`, ['Esporta', 'data-a="openExport"']],
  ['Privacy e sicurezza', `<p>Con il <b>codice di blocco</b> l'app chiede un codice a ogni apertura, o dopo il tempo che scegli.</p><p>L'<b>occhio</b> in alto nella Home nasconde tutti gli importi; con <b>Nascondi gli importi all'apertura</b> l'app parte sempre coperta.</p><p>I tuoi dati non escono mai dal telefono: a internet vengono chiesti solo i cambi delle valute e i prezzi dei titoli, senza informazioni personali.</p>`, ['Codice di blocco', 'data-a="setPage" data-p="security"']],
  ['Valuta principale', `<p>È la valuta di saldi, budget e statistiche. Si cambia in Impostazioni → Valuta principale: puoi convertire tutti gli importi al cambio di oggi, proposto in automatico, oppure cambiare solo il simbolo se all'inizio avevi scelto la valuta sbagliata.</p>`, ['Valuta principale', 'data-a="openBaseCur"']],

  ["Aggiornare l'app", `<p>Dal PC estrai il nuovo zip, apri il repository su GitHub, fai clic su Add file → Upload files e trascina i file, non la cartella, sopra quelli vecchi; poi Commit changes.</p><p>Dopo un paio di minuti riapri l'app: si aggiorna da sola e i dati restano. Se non vedi le novità, chiudila dal multitasking e riaprila.</p>`],
  ['Cambiare telefono o reinstallare', `<p>Prima esporta tutto in Excel e salva il file su iCloud Drive. Sul nuovo telefono installa l'app da Safari, poi nella schermata di benvenuto tocca <b>Importa i tuoi dati</b> e scegli il file: torna tutto com'era.</p><p>Non eliminare mai l'icona senza aver salvato prima i dati: togliendo l'app si possono perdere.</p>`],
  ['Problemi frequenti', `<p><b>L'app non mostra le novità.</b> Aspetta due minuti dopo il caricamento su GitHub, poi chiudi l'app dal multitasking e riaprila. Controlla che index.html sia nella radice del repository, non in una cartella.</p><p><b>In Safari vedo dati diversi.</b> Safari e l'app installata hanno memorie separate: usa sempre l'icona.</p><p><b>Ho perso i dati.</b> Ripristinali con Importa dati, scegliendo l'ultimo file esportato o il backup.</p><p><b>Il file esportato non si reimporta.</b> I file esportati prima della versione 1.6 contengono solo i movimenti: esporta di nuovo con la versione attuale.</p><p><b>Il cambio non si scarica.</b> Controlla la connessione; la BCE pubblica i cambi nei giorni lavorativi. Intanto scrivilo a mano.</p><p><b>I prezzi non si aggiornano.</b> Servono simbolo e quote: tocca Aggiorna ora in Investimenti e leggi il messaggio.</p><p><b>L'addebito della carta non torna.</b> Controlla i giorni di chiusura e di addebito, poi correggi il movimento dell'addebito.</p><p><b>Il promemoria degli investimenti ricompare.</b> Salva i valori oppure tocca Ricordamelo domani; puoi cambiarne la frequenza o sceglierne Mai.</p><p><b>L'import non riconosce le colonne.</b> Scegli tu quale colonna contiene la data e quale l'importo, poi controlla formato delle date e segno degli importi.</p><p><b>Ho dimenticato il codice di blocco.</b> Nella schermata di blocco puoi cancellare i dati e ripartire: per questo è importante esportarli ogni tanto.</p>`]

const guideNorm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
SETTINGS.guide = () => {
  let h = sheetHead('Guida e soluzioni', { back: true, grab: false }) + '<div class="sheet-body">';
  h += '<label class="fld guide-q"><span>Cerca nella guida</span><input data-in="guideFind" placeholder="Es. carta, PAC, backup" autocomplete="off"></label>';
  h += `<div class="guide">${GUIDE.map(([t, body, act]) => `<details><summary>${esc(t)}${ic('right', 16)}</summary><div class="g-b">${body}${act ? `<button class="link g-go" ${act[1]}>${esc(act[0])}</button>` : ''}</div></details>`).join('')}<p class="muted sm guide-none" hidden>Nessun argomento trovato: prova con un'altra parola.</p></div>`;
  return h + `<p class="foot-note">EFU Budget versione ${APP_VERSION}.</p></div>`;
};
INP.guideFind = el => {
  const q = guideNorm(el.value.trim()), box = el.closest('.sheet-body');
  let shown = 0;
  for (const d of box.querySelectorAll('.guide details')) {
    const hit = !q || guideNorm(d.textContent).includes(q);
    d.hidden = !hit;
    d.open = hit && q.length >= 3;
    if (hit) shown++;
  }
  const none = box.querySelector('.guide-none');
  if (none) none.hidden = shown > 0;
};

/* =========================================================
   Versione 1.6.1
   Prima di cancellare tutti i dati, o di sostituirli con un file,
   l'app propone di esportarli
   ========================================================= */
let AFTER_SAVE = null;
function wipeAll() {
  wipeStorage(); D = null;
  UI.sheets.slice().forEach(s => closeSheet(s));
  UI.tab = 'home'; UI.month = curMk(); UI.filters = blankFilters();
  render(); toast('Dati cancellati', null);
}
SHEETS.safeFirst = {
  init: () => ({ busy: false }),
  render(st, sh) {
    const wipe = sh.props.mode === 'wipe', n = D ? D.movements.length : 0, last = D && D.settings.lastBackup;
    let h = sheetHead(wipe ? 'Cancellare tutti i dati?' : 'Sostituire i dati?') + '<div class="sheet-body">';
    h += `<p class="lead sm">${wipe ? 'Stai per cancellare da questo telefono' : 'Il file che hai scelto prenderà il posto, su questo telefono, di'} ${n} ${n === 1 ? 'movimento' : 'movimenti'}, con conti, spese fisse, investimenti e impostazioni.</p>`;
    h += "<p class=\"lead sm\">Prima ti conviene esportarli: con il file potrai rimettere tutto com'era, anche su un altro telefono.</p>";
    h += last ? `<p class="muted sm">Ultima esportazione o backup: ${esc(shortDate(last))}.</p>` : '<p class="warn-t">Non hai ancora mai esportato i tuoi dati.</p>';
    return h + `</div><footer class="sheet-foot"><button class="btn primary w" data-a="safeExport" ${st.busy ? 'disabled' : ''}>${st.busy ? 'Preparo il file…' : wipe ? 'Esporta e poi cancella' : 'Esporta e poi importa'}</button><button class="link w later${wipe ? ' danger' : ''}" data-a="safeSkip">${wipe ? 'Cancella senza esportare' : 'Importa senza esportare'}</button></footer>`;
  }
};
ACT.safeExport = async el => {
  const sh = sheetOf(el), st = sh.st, { mode, then } = sh.props;
  st.busy = true; drawSheet(sh);
  try {
    const out = await buildXlsx('all');
    closeSheet(sh);
    AFTER_SAVE = () => confirmBox(mode === 'wipe' ? 'File salvato: cancello i dati?' : 'File salvato: importo il nuovo file?', 'Prima controlla di averlo salvato in File o su iCloud Drive.', mode === 'wipe' ? 'Cancella tutto' : 'Importa tutto', then, mode === 'wipe');
    openSheet('fileReady', Object.assign(out, { kind: 'safe' }));
  } catch (e) { st.busy = false; drawSheet(sh); toast('Esportazione non riuscita: ' + (e.message || e), null); }
};
ACT.safeSkip = el => {
  const sh = sheetOf(el), { mode, then } = sh.props;
  if (mode !== 'wipe') { closeSheet(sh); return then(); }
  confirmBox('Cancellare senza una copia?', 'I dati verranno eliminati da questo telefono e non si potranno più recuperare.', 'Cancella tutto', () => { closeSheet(sh); then(); });
};
ACT.wipe = () => {
  if (!D) return;
  AFTER_SAVE = null;
  if (D.settings.demo) return confirmBox('Cancellare i dati di esempio?', 'Sono solo dati di prova: non serve esportarli.', 'Cancella', wipeAll);
  openSheet('safeFirst', { mode: 'wipe', then: wipeAll });
};

/* =========================================================
   Avvio
   ========================================================= */
let HIDDEN_AT = 0;
function onVis() {
  if (document.hidden) { HIDDEN_AT = Date.now(); return; }
  if (D && D.settings.pin && !UI.locked && HIDDEN_AT && (Date.now() - HIDDEN_AT) / 1000 >= (D.settings.lockAfter || 0)) showLock();
  HIDDEN_AT = 0;
  if (D) autoPrices(false);
  if (UI.day !== today()) {
    const old = mk(UI.day);
    UI.day = today();
    invalidate();
    if (UI.month === old) UI.month = curMk();
    if (D) { if (syncAuto()) save({ undo: false }); INV_ASKED = false; refresh(); setTimeout(invReminderCheck, 800); }
  }
}
const SPLASH_T0 = Date.now();
function hideSplash(now) {
  const s = document.getElementById('splash');
  if (!s || s.classList.contains('out')) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = now ? 0 : Math.max(0, (reduce ? 500 : 1200) - (Date.now() - SPLASH_T0));
  setTimeout(() => { s.classList.add('out'); setTimeout(() => { if (s.parentNode) s.parentNode.removeChild(s); }, 450); }, wait);
}
setTimeout(() => hideSplash(true), 5000);
function boot() {
  D = load();
  bootExtras();
  initCapabilities();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pageshow', e => { if (e.persisted) onVis(); });
  if (D && D.settings.pin) showLock();
  render();
  hideSplash();
  setTimeout(invReminderCheck, 1800);
  setTimeout(() => autoPrices(false), 2600);
  if (IS_PACKAGE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
