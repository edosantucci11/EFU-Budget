# Pubblicazione automatica di EFU Budget su GitHub Pages.
# A ogni modifica dei sorgenti su main: compone l'app, esegue il collaudo e,
# solo se è tutto OK, pubblica i file di dist/EFU-Budget/ sul sito.
# Su una richiesta di modifica (pull request) compone e collauda soltanto.
name: Componi, collauda e pubblica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pubblicazione-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collaudo:
    name: Componi e collauda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Componi l'app
        run: python3 build.py

      - name: Prepara il browser di prova
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Collaudo
        run: python3 tests/collaudo.py

      - name: Schermate del collaudo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: tests/schermate/
          if-no-files-found: ignore

      - name: Prepara i file del sito
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/EFU-Budget

  pubblica:
    name: Pubblica su GitHub Pages
    needs: collaudo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
